<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Device settings</title>
	<style>
		input[type=submit],
		input[type=button],
		button {
			height: 35px;
			font-size: 20px;
			width: 90%;
			max-width: 300px;
			margin: 8px 5px;
			background-color: #4CAF50;
			border: none;
			border-radius: 8px;
			color: white;
			cursor: pointer;
			padding: 0px 10px;
		}
				
		body {
			font-family: Verdana;
			margin-top: 15px;
		}

		label {
			white-space: nowrap;
			font-size: 20px;
			margin: 0 5px;
		}
		p {
			font-size: 20px;
			border-radius: 10px;
			background-color: #f2f2f2;
			box-shadow: #aaa 0px 0px 10px;
			margin: 15px;
		}

		.access-token-input 
		{
			width: 400px;
		}

		.wifi-stations-block {
			font-size: 20px;
			border-radius: 10px;
			background-color: #ffffff;
			box-shadow: #fafad2 0px 0px 10px;
			margin: 15px;
		}		
	</style>
</head>
<body>
<p>
	System settings<br>
</p>
<p>	
	<div>
		Warning: Keep your token secure and store it safely, it can be used by anyone to control your bot.
	</div>
	<br>
	<form method='post' action='saveSettings'>
			<table>
			<tr>
				<td colspan = 2>
					<p>Telegram bot settings</p>
				</td>
			</tr>			
			<tr>
				<td>
					<label>Bot token</label>
				</td>
					<td>
						<input name='botToken' length=640 class="access-token-input" value="@botToken">
				</td>
			</tr>
			<tr>
				<td>
					<label>Receive userid 0</label>
				</td>
				<td>
					<input name='receiveId0' length=64 value="@receiveId0">
				</td>
			</tr>
			<tr>
				<td>
					<label>Receive userid 1</label>
				</td>
				<td>
					<input name='receiveId1' length=64 value="@receiveId1">
				</td>
			</tr>
			<tr>
				<td colspan = 2>
					<p>Adafruit settings</p>
				</td>
			</tr>	
			<tr>
				<td>
					<label>Adafruit server</label>
				</td>
				<td>
					<input name='adafruitServer' value="@adafruitServer">
				</td>
			</tr>
			<tr>
				<td>
					<label>Adafruit port</label>
				</td>
				<td>
					<input name='adafruitPort' value="@adafruitPort">
				</td>
			</tr>
			<tr>
				<td>
					<label>Adafruit username</label>
				</td>
				<td>
					<input name='adafruitUser' value="@adafruitUser">
				</td>
			</tr>	
			<tr>
				<td>
					<label>Adafruit app key</label>
				</td>
				<td>
					<input name='adafruitAppKey' value="@adafruitAppKey">
				</td>
			</tr>
			<tr>
				<td colspan = 2>
					<p></p>
				</td>
			</tr>
			<tr>
				<td>
					<label>Temperature feeds name</label>
				</td>
				<td>
					<input name='aioTempatureName' value="@adafruitTempatureName">
				</td>
			</tr>
			<tr>
				<td>
					<label>Gaz sensor feeds name</label>
				</td>
				<td>
					<input name='aioGazName' value="@aioGazName">
				</td>
			</tr>	
			<tr>
				<td colspan = 2>
					<p>Alarms thresholds</p>
				</td>
			</tr>
			<tr>
				<td>
					<label>Min temperature</label>
				</td>
				<td>
					<input name='minAlarmTemperature' value="@minAlarmTemperature">
				</td>
			</tr>
			<tr>
				<td>
					<label>Max temperature</label>
				</td>
				<td>
					<input name='maxAlarmTemperature' value="@maxAlarmTemperature">
				</td>
			</tr>
			<tr>
				<td>
					<label>Alarm gaz value</label>
				</td>
				<td>
					<input name='alarmGazValue' value="@alarmGazValue">
				</td>
			</tr>			
		</table>
		<input type='submit' value="Save settings">
	</form>
</p>
</body>
</html>
